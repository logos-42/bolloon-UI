<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolloon · 原文查看</title>
<link rel="icon" href="icons/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="icons/favicon-32x32.png" sizes="32x32">
<style>
  :root { --bg:#12110f; --ink:#e8e8dc; --dim:#8a8a80; --lime:#c4d640; --line:#2a2a26; --panel:#1a1a18; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); line-height: 1.6; margin: 0;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
  a { color: var(--lime); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 26px 20px 60px; }
  .back { text-decoration: none; font-size: 13px; color: rgba(232,232,220,.6); letter-spacing: .5px; }
  .back:hover { color: var(--lime); }
  h1 { font-weight: 600; font-size: 30px; letter-spacing: -.4px; margin: 16px 0 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 6px; }
  .tag { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .addr { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 8px 10px; font-size: 12.5px; color: var(--ink); word-break: break-all; flex: 1 1 320px; }
  button { background: var(--lime); color: #141410; border: 0; border-radius: 8px;
           padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  pre#body { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             padding: 16px; margin-top: 14px; white-space: pre-wrap; word-break: break-word;
             font-size: 13px; line-height: 1.65; color: var(--ink); min-height: 200px; }
  .note { color: var(--dim); font-size: 12.5px; margin-top: 10px; }
  .err { color: #ef4444; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="skill.html">← 返回 skills</a>
  <h1 id="title">原文查看</h1>
  <div class="bar">
    <span class="tag">原文地址</span>
    <code class="addr" id="addr">—</code>
    <button type="button" id="copy">复制地址</button>
    <a class="back" id="openRaw" href="#" target="_blank" rel="noopener">直接打开原文</a>
  </div>
  <pre id="body">载入中…</pre>
  <p class="note" id="note">
    本页用 <code>fetch</code> 取原文再渲染成文本 —— 浏览器对 fetch 永远不会把它当下载，
    所以任何缓存状态 / MIME 配置下都点开就能看。要交给 agent 的是上面那条「原文地址」。
  </p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var f = q.get('f') || '';
  var addr = document.getElementById('addr');
  var body = document.getElementById('body');
  var title = document.getElementById('title');
  var openRaw = document.getElementById('openRaw');
  var note = document.getElementById('note');

  // 只允许本站顶层的一份 .md —— 不接受路径/协议, 免得变成任意内容注入的口子
  if (!/^[A-Za-z0-9._-]+\.md$/.test(f)) {
    body.className = 'err';
    body.textContent = '缺少或非法的 f 参数。用法: view.html?f=bolloon-network.md';
    title.textContent = '原文查看';
    return;
  }
  title.textContent = f;
  addr.textContent = location.origin + '/' + f;
  openRaw.href = f;

  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    var done = function () { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制地址'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr.textContent).then(done, done);
    } else {
      var r = document.createRange(); r.selectNodeContents(addr);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); } catch (e) {}
      s.removeAllRanges(); done();
    }
  });

  fetch(f, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (t) {
      body.textContent = t;
      var m = /^version:\s*(.+)$/m.exec(t);
      if (m) title.textContent = f + ' · v' + m[1].trim();
    })
    .catch(function (e) {
      body.className = 'err';
      body.textContent = '取不到这份原文: ' + e.message + '\n\n可能是名字写错, 或这份文档还没上站。'
        + '\n不确定有哪些: 回到 skill.html 看索引(那里列的就是全部)。';
    });
})();
</script>
</body>
</html>
